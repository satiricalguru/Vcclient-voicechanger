<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="mic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e0ff"/>
      <stop offset="100%" style="stop-color:#c4b5fd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#7c3aed" flood-opacity="0.5"/>
    </filter>
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="url(#accent)" stroke-width="3"/>
  
  <!-- Sound wave rings -->
  <circle cx="256" cy="230" r="160" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.15"/>
  <circle cx="256" cy="230" r="130" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.25"/>
  <circle cx="256" cy="230" r="100" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.35"/>
  
  <!-- Sound wave arcs (left) -->
  <path d="M 140 170 Q 120 230 140 290" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.5" filter="url(#outerGlow)"/>
  <path d="M 115 145 Q 85 230 115 315" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
  <path d="M 92 125 Q 55 230 92 335" fill="none" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.2"/>
  
  <!-- Sound wave arcs (right) -->
  <path d="M 372 170 Q 392 230 372 290" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.5" filter="url(#outerGlow)"/>
  <path d="M 397 145 Q 427 230 397 315" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
  <path d="M 420 125 Q 457 230 420 335" fill="none" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.2"/>
  
  <!-- Microphone body -->
  <rect x="224" y="140" width="64" height="130" rx="32" ry="32" fill="url(#mic)" filter="url(#shadow)"/>
  
  <!-- Microphone grille lines -->
  <line x1="234" y1="165" x2="278" y2="165" stroke="#a78bfa" stroke-width="1.5" opacity="0.4"/>
  <line x1="234" y1="178" x2="278" y2="178" stroke="#a78bfa" stroke-width="1.5" opacity="0.4"/>
  <line x1="234" y1="191" x2="278" y2="191" stroke="#a78bfa" stroke-width="1.5" opacity="0.4"/>
  <line x1="234" y1="204" x2="278" y2="204" stroke="#a78bfa" stroke-width="1.5" opacity="0.4"/>
  <line x1="234" y1="217" x2="278" y2="217" stroke="#a78bfa" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Microphone holder arc -->
  <path d="M 200 250 Q 200 320 256 320 Q 312 320 312 250" fill="none" stroke="url(#mic)" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Microphone stand -->
  <line x1="256" y1="320" x2="256" y2="380" stroke="url(#mic)" stroke-width="5" stroke-linecap="round"/>
  <line x1="220" y1="380" x2="292" y2="380" stroke="url(#mic)" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Accent dot -->
  <circle cx="256" cy="155" r="4" fill="#a855f7" opacity="0.8"/>
</svg>
